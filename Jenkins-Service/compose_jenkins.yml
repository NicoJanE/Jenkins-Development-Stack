networks:
  dev1-net:                       # Define a network key ID reference by the service (advice make it the same as in  the Network name below)
    external: true                # true: network is created by user or already exists. false docker will create this network with your 
    name: dev1-net                # Actual Network name as was/will be defined
    driver: bridge 
    ipam:
      config:
        - subnet: ${FIXED_SUBNET}

# 1) Explanation 'external'
# external: false → Docker Compose creates the network automatically using IP defined in .env
#
# Changes this to 'true' in case you need other in depended (defined in other compose files)  Docker-services
# to access the service defined here. In that case you need:
#
#   1) Set the name network name(dev1-net) also in the other Docker compose file 
#   2) Set the external in the other compose file to true
#   3) Use the same network Subnets(defined in .env file) in both services
#   4) start network manually before starting any of the services (make sure to use the correct sub network)
#
#       Example: docker network create --subnet=${FIXED_SUBNET} dev1-net
#
#   Test if both are on the same network: docker network inspect dev1-net
#   To Test the used IP address inside the container enter: hostname -I
        
        
volumes:
  nje-shared_container-vol:         # named volumes, for: sharing data between containers, persistent data
                                    # can be used in service volumes, like: nje-shared_container-vol:./workspace/shared 
                                   
services:
  jenkins-img:                      # Our service 
    build: 	    
      context: .
      dockerfile: Dockerfile_Jenkins 
    ports:                                 
      - "8081:8080"                         # host:cont 
      - "50000:5000"                        # host:cont 
    networks:                               # commented because we use Host network in service
      dev1-net:                             # Use this Network
        ipv4_address: ${FIXED_IP5}          # Assign a fixed IP to the container
    volumes:
#     - ../workspace:/workspace             # Bind mount to .Net 8.o workspace directory        
      - /var/run/docker.sock:/var/run/docker.sock           # Jenkins access to the Docker daemon on your host.
      - ./jenkins_home:/var/jenkins_home                    # Persists Jenkins data (jobs, configurations)    
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false    # Disables the Jenkins setup wizard    
    command: ["java", "-jar", "/usr/share/jenkins/jenkins.war", "--httpPort=8080"]  # Run Jenkins (Java) Note port is internal
    
    
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"                         # SMTP port
      - "8025:8025"                         # Web UI port
    networks:
      - dev1-net

# For mailhog:
# No account needed, you can what every you like; for example:an-error@local.jek
# 1) Jenkins -> Configuration ->Extended E-Mail Notification. 
#       - Enter: mailhog, 
#       - port:1025 
# 2) Access: http://localhost:8025 to view the mail received
    
# Create and start: docker-compose -f compose_jenkins.yml up -d --build --force-recreate 

